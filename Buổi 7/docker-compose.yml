services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: products
      POSTGRES_USER: products
      POSTGRES_PASSWORD: products
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U products -d products"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://products:products@db:5432/products
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://products:products@db:5432/products
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
