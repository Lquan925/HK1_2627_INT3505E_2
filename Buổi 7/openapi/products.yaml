  "components": {
    "schemas": {
      "Product": {
        "type": "object",
        "properties": {
          "id": {
            "type": "integer"
          },
          "sku": {
            "type": "string"
          },
          "name": {
            "type": "string"
          },
          "description": {
            "type": "string",
            "nullable": true
          },
          "price_cents": {
            "type": "integer",
            "minimum": 0
          },
          "qty_in_stock": {
            "type": "integer",
            "minimum": 0
          },
          "archived": {
            "type": "boolean"
          },
          "created_at": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "ProductIn": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "sku",
          "name",
          "price_cents"
        ],
        "properties": {
          "sku": {
            "type": "string",
            "minLength": 3,
            "maxLength": 32
          },
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 255
          },
          "description": {
            "type": "string",
            "maxLength": 2000,
            "nullable": true
          },
          "price_cents": {
            "type": "integer",
            "minimum": 0
          },
          "qty_in_stock": {
            "type": "integer",
            "minimum": 0,
            "default": 0
          }
        }
      },
      "ProductPatch": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 255
          },
          "price_cents": {
            "type": "integer",
            "minimum": 0
          }
        }
      },
      "ReserveIn": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "qty"
        ],
        "properties": {
          "qty": {
            "type": "integer",
            "minimum": 1
          }
        }
      },
      "Error": {
        "type": "object",
        "required": [
          "code"
        ],
        "properties": {
          "code": {
            "type": "string"
          },
          "message": {
            "oneOf": [
              {
                "type": "string"
              },
              {
                "type": "object"
              }
            ]
          }
        }
      },
      "OrderItemIn": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "product_id",
          "qty"
        ],
        "properties": {
          "product_id": {
            "type": "integer",
            "minimum": 1
          },
          "qty": {
            "type": "integer",
            "minimum": 1
          }
        }
      },
      "OrderIn": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "items"
        ],
        "properties": {
          "items": {
            "type": "array",
            "minItems": 1,
            "maxItems": 100,
            "items": {
              "$ref": "#/components/schemas/OrderItemIn"
            }
          }
        }
      },
      "OrderItem": {
        "type": "object",
        "properties": {
          "id": {
            "type": "integer"
          },
          "product_id": {
            "type": "integer"
          },
          "qty": {
            "type": "integer"
          },
          "unit_price_cents": {
            "type": "integer"
          },
          "product": {
            "$ref": "#/components/schemas/Product"
          }
        }
      },
      "Order": {
        "type": "object",
        "properties": {
          "id": {
            "type": "integer"
          },
          "created_at": {
            "type": "string",
            "format": "date-time"
          },
          "items": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/OrderItem"
            }
          }
        }
      }
    }
  }
