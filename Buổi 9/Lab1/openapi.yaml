openapi: "3.0.3"
info:
  title: "User API Versioning"
  version: "2.0.0"
  description: "Shared in-memory users. Created users are lost when the server restarts."
servers:
  -
    url: "http://127.0.0.1:5000"
paths:
  "/api/v1/users/{uid}":
    get:
      operationId: "getUserV1"
      deprecated: true
      parameters:
        -
          name: "uid"
          in: "path"
          required: true
          schema:
            type: "integer"
            minimum: 0
      responses:
        "200":
          description: "User found"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/UserV1"
          headers:
            Sunset:
              description: "Illustrative planned retirement date; configured in app.py. This header does not automatically disable v1."
              schema:
                type: "string"
              example: "Fri, 31 Dec 2027 23:59:59 GMT"
        "404":
          description: "User not found"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
          headers:
            Sunset:
              description: "Illustrative planned retirement date; configured in app.py. This header does not automatically disable v1."
              schema:
                type: "string"
              example: "Fri, 31 Dec 2027 23:59:59 GMT"
  "/api/v2/users/{uid}":
    get:
      operationId: "getUserV2"
      parameters:
        -
          name: "uid"
          in: "path"
          required: true
          schema:
            type: "integer"
            minimum: 0
      responses:
        "200":
          description: "User found"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/UserV2"
        "404":
          description: "User not found"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
  "/api/v2/users":
    post:
      operationId: "createUserV2"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/CreateUser"
      responses:
        "201":
          description: "User created"
          headers:
            Location:
              description: "URL of the created user"
              schema:
                type: "string"
              example: "/api/v2/users/3"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/UserV2"
        "400":
          description: "Invalid request"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: "Content-Type must be application/json"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    CreateUser:
      type: "object"
      additionalProperties: false
      required:
        - "first_name"
        - "last_name"
        - "email"
      properties:
        first_name:
          type: "string"
          minLength: 1
        last_name:
          type: "string"
          minLength: 1
        email:
          type: "string"
          minLength: 1
      example:
        first_name: "An"
        last_name: "Lê"
        email: "an@vnu.vn"
    UserV1:
      type: "object"
      required:
        - "id"
        - "full_name"
        - "email"
      properties:
        id:
          type: "integer"
        full_name:
          type: "string"
        email:
          type: "string"
    UserV2:
      type: "object"
      required:
        - "id"
        - "first_name"
        - "last_name"
        - "email"
      properties:
        id:
          type: "integer"
        first_name:
          type: "string"
          minLength: 1
        last_name:
          type: "string"
          minLength: 1
        email:
          type: "string"
          minLength: 1
    Error:
      type: "object"
      required:
        - "error"
      properties:
        error:
          type: "string"
