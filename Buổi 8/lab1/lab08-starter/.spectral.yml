extends: ["spectral:oas"]

rules:
  operation-operationId: error

  no-content-for-204:
    description: Response 204 must not declare content.
    severity: error
    given: "$.paths[*][*].responses['204']"
    then:
      field: content
      function: undefined

  book-year-integer:
    description: Book.year must be an integer.
    severity: error
    given: "$.components.schemas.Book.properties.year"
    then:
      field: type
      function: enumeration
      functionOptions:
        values: [integer]

  response-200-nonempty-schema:
    description: Response 200 must have a nonempty JSON schema.
    severity: error
    given: "$.paths[*][*].responses['200']"
    then:
      field: content.application/json.schema
      function: schema
      functionOptions:
        schema:
          type: object
          minProperties: 1