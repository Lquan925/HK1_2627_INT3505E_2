extends: ["spectral:oas"]

rules:
  operation-operationId: error

  no-content-for-204:
    description: Response 204 must not declare content.
    severity: error
    given: "$.paths[*][*].responses['204']"
    then:
      field: content
      function: undefined

  book-year-integer:
    description: Book.year must be an integer.
    severity: error
    given: "$.components.schemas.Book.properties.year"
    then:
      field: type
      function: enumeration
      functionOptions:
        values: [integer]

  response-200-nonempty-schema:
    description: Response 200 must define object fields (or array item fields).
    severity: error
    given: "$.paths[*][*].responses['200']"
    then:
      field: content.application/json.schema
      function: schema
      functionOptions:
        schema:
          type: object
          anyOf:
            - required: [type, properties]
              properties:
                type: {const: object}
                properties: {type: object, minProperties: 1}
            - required: [type, items]
              properties:
                type: {const: array}
                items:
                  type: object
                  required: [type, properties]
                  properties:
                    type: {const: object}
                    properties: {type: object, minProperties: 1}
